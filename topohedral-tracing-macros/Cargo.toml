[package]
name = "topohedral-tracing-macros"
version = "0.2.0"
authors = ["John Ferguson <JAFerguson952@gmail.com>"]
edition = "2021"
rust-version = "1.70"
repository = "https://github.com/TopoHedralLabs/topohedral-tracing"
license = "MIT"
description = "Procedural macros for topohedral-tracing. Provides the #[trace_fn] attribute macro."
keywords = ["logging", "tracing", "macro", "instrumentation"]
categories = ["development-tools::debugging"]
publish = ["cloudsmith"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "parsing"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3.4.0"
